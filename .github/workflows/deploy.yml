name: Deploy Shoreline Sanctuary

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shoreline-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shoreline
        run: pnpm run build

      - name: Create deployment archive
        run: |
          printf "%s\n" "${{ github.sha }}" > deploy-commit.txt
          tar -czf deploy.tar.gz \
            .next \
            app \
            components \
            lib \
            public \
            package.json \
            next.config.js \
            server.js \
            deploy-commit.txt

      - name: Upload deployment archive
        id: upload
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          source: deploy.tar.gz
          target: /home/aflomfbj/shoreline.dreamwavespa.com/app
          tar_tmp_path: /home/aflomfbj/shoreline.dreamwavespa.com/app/tmp
          overwrite: true

      - name: Install deployment and restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -e
            cd /home/aflomfbj/shoreline.dreamwavespa.com/app
            # Stage the new Next.js build separately so old build artifacts cannot linger.
            mkdir -p tmp
            stage_dir=$(mktemp -d ./tmp/shoreline-build.XXXXXX)
            tar -xzf deploy.tar.gz -C "$stage_dir" .next
            test -f "$stage_dir/.next/BUILD_ID"
            # Extract application files without merging the .next directories.
            tar -xzf deploy.tar.gz --exclude='./.next' --exclude='.next'
            # Swap builds with a rollback path if the move fails.
            if [ -d .next ]; then mv .next "$stage_dir/previous-next"; fi
            if ! mv "$stage_dir/.next" .next; then
              if [ -d "$stage_dir/previous-next" ]; then mv "$stage_dir/previous-next" .next; fi
              exit 1
            fi
            printf 'Deployed commit: '; cat deploy-commit.txt
            printf 'Next build ID: '; cat .next/BUILD_ID
            rm -rf "$stage_dir"
            mkdir -p tmp
            touch tmp/restart.txt

      - name: Remove temporary deployment archives even after failure
        if: ${{ always() && steps.upload.outcome != 'skipped' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -e
            cd /home/aflomfbj/shoreline.dreamwavespa.com/app
            rm -f deploy.tar.gz
            if [ -d tmp ]; then
              find tmp -maxdepth 1 -type f -name '*.tar.gz' -delete
            fi
