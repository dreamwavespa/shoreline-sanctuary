name: Showcase pull request build check
on:
  pull_request:
    branches: [main]
    paths:
      - "app/showcase/**"
      - "app/api/showcase/**"
      - "lib/showcaseAuth.ts"
      - ".github/workflows/showcase-check.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # The repository lockfile currently has a picomatch mismatch.\n      # Use npm install for this isolated verification workflow until the lockfile is repaired.\n      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SHOWCASE_PASSWORD: build-only-placeholder
          SHOWCASE_SESSION_SECRET: build-only-placeholder-secret-32-characters
